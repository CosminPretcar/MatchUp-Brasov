name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ] # Triggered when changes are pushed to the main branch
    paths:
      - 'frontend/**' # Runs ONLY when something changes in the frontend folder
      - '.github/workflows/deploy-frontend.yml'

# Permissions required to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Copy the repository code to the virtual machine
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Node.js v20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # 3. Install frontend dependencies
      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend

      # 4. Build the React/Vite project (generates the dist folder)
      - name: Build Project
        run: npm run build
        working-directory: ./frontend

      # 5. Prepare the files for publication
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 6. Upload the compiled frontend/dist folder
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      # 7. Deploy the project to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4