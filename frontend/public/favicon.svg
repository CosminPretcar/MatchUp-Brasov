<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1A2633"/>
      <stop offset="60%" stop-color="#0F131C"/>
      <stop offset="100%" stop-color="#080B11"/>
    </radialGradient>
    <linearGradient id="emeraldGradApp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BF3B4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="neonVoltApp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF4A"/>
      <stop offset="100%" stop-color="#94DE2D"/>
    </linearGradient>
    <filter id="iconNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGlow)"/>
  <rect width="506" height="506" x="3" y="3" rx="113" fill="none" stroke="#1F2A38" stroke-width="4"/>

  <!-- Subtle pitch background grid/lines -->
  <g opacity="0.3">
    <!-- Outer perimeter pitch outline -->
    <rect x="76" y="76" width="360" height="360" rx="36" fill="none" stroke="#253549" stroke-width="4"/>
    <!-- Half-way line -->
    <line x1="76" y1="256" x2="436" y2="256" stroke="#253549" stroke-width="4" stroke-dasharray="8 8"/>
    <!-- Center circle -->
    <circle cx="256" cy="256" r="72" fill="none" stroke="#253549" stroke-width="4"/>
    <!-- Center spot -->
    <circle cx="256" cy="256" r="6" fill="#4EDEA3"/>
    <!-- Penalty boxes -->
    <path d="M166 76 L166 140 L346 140 L346 76" fill="none" stroke="#253549" stroke-width="3"/>
    <path d="M166 436 L166 372 L346 372 L346 436" fill="none" stroke="#253549" stroke-width="3"/>
  </g>

  <!-- Glowing Hexagonal Sports Shield Shield Base -->
  <path d="M256 90 L400 162 L400 350 L256 422 L112 350 L112 162 Z" 
        fill="#121A26" 
        stroke="url(#emeraldGradApp)" 
        stroke-width="7" 
        stroke-linejoin="round"
        opacity="0.95"/>

  <!-- Inner Dynamic Lightning / Matchmaking Spear Mark -->
  <path d="M268 116 L174 266 L250 266 L224 394 L338 236 L262 236 Z" 
        fill="url(#neonVoltApp)" 
        filter="url(#iconNeonGlow)"
        stroke="#0F131C" 
        stroke-width="7" 
        stroke-linejoin="round"/>

  <!-- High-contrast Pinpoint Apex (Brașov Location Reference) -->
  <circle cx="256" cy="140" r="10" fill="#FFFFFF"/>
  <circle cx="256" cy="140" r="18" fill="none" stroke="#5BF3B4" stroke-width="3" stroke-opacity="0.8"/>
</svg>